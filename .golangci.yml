version: "2"
run:
  tests: false
linters:
  default: all
  disable:
    - cyclop
    - dupl
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errname
    - exhaustive
    - exhaustruct
    - forcetypeassert
    - funcorder
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - gocritic
    - godot
    - godox
    - gosec
    - ireturn
    - mnd
    - noinlineerr
    - nonamedreturns
    - paralleltest
    - perfsprint
    - recvcheck
    - revive
    - staticcheck
    - tagliatelle
    - testpackage
    - unused
    - varnamelen
    - wrapcheck
    - wsl
    - gomodguard
    - exhaustruct_v5
  settings:
    gomoddirectives:
      # This is a go.work workspace; every cross-module require is a local
      # replace, so the default rejection fires on 11 modules.
      replace-local: true
    depguard:
      rules:
        whitelist:
          list-mode: lax
          files:
            - $all
            - '!*_test.go'
          deny:
            - pkg: io/ioutil
              desc: io/ioutil is deprecated, use io instead
            # Third-party substitutes for x/rkit (same list as the scaffolded
            # workspaces' .golangci.yml). Hand-written copies are caught by
            # `make lint-rkit` instead.
            - pkg: github.com/jinzhu/copier
              desc: use x/rkit (DynCast/DynCastOption/TypeConvert); only x/rkit may wrap copier
            - pkg: github.com/google/uuid
              desc: use x/rkit (RandomID/SecureRandomUint64)
            - pkg: github.com/gofrs/uuid
              desc: use x/rkit (RandomID/SecureRandomUint64)
            - pkg: github.com/rs/xid
              desc: use x/rkit (RandomID)
            - pkg: github.com/oklog/ulid
              desc: use x/rkit (RandomID)
            - pkg: github.com/segmentio/ksuid
              desc: use x/rkit (RandomID)
            - pkg: github.com/matoous/go-nanoid
              desc: use x/rkit (RandomID)
            - pkg: github.com/samber/lo
              desc: use x/rkit collection helpers or slices/maps
            - pkg: github.com/thoas/go-funk
              desc: use x/rkit collection helpers or slices/maps
            - pkg: github.com/iancoleman/strcase
              desc: use x/rkit (ToCamel/ToSnake/ToKebab/...)
            - pkg: github.com/ettle/strcase
              desc: use x/rkit (ToCamel/ToSnake/ToKebab/...)
    errcheck:
      check-type-assertions: true
      check-blank: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  settings:
    gci:
      sections:
        - standard
        - prefix(github.com/clubpay/ronykit)
        - default
        - blank
        - dot
      custom-order: true
    golines:
      max-len: 110
      shorten-comments: true
      reformat-tags: true
      chain-split-dots: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
