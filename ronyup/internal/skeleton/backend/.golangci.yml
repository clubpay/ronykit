version: "2"
# RonyKIT package-selection enforcement.
# This config is intentionally minimal: it keeps golangci-lint's default linters
# and adds `depguard` to fail the build when service code imports a third-party
# or stdlib package that has a mandated RonyKIT replacement. See the ronyup MCP
# resource `knowledge://ronyup/architecture/package-selection` for the full map.
# depguard only sees imports; hand-written copies of x/rkit helpers are caught by
# `ronyup lint`, which verify.sh runs on every feature module.
run:
  tests: false
linters:
  enable:
    - depguard
  settings:
    depguard:
      rules:
        ronykit:
          list-mode: lax
          files:
            - $all
            - "!$test"
          deny:
            - pkg: go.temporal.io/sdk
              desc: "Do not use the Temporal SDK directly. Use github.com/clubpay/ronykit/flow for all durable workflows/activities."
            - pkg: log
              desc: "Do not use the standard log package. Use github.com/clubpay/ronykit/x/telemetry/logkit."
            - pkg: log/slog
              desc: "Do not use log/slog. Use github.com/clubpay/ronykit/x/telemetry/logkit."
            - pkg: go.uber.org/zap
              desc: "Do not use zap directly. Use github.com/clubpay/ronykit/x/telemetry/logkit."
            - pkg: github.com/google/uuid
              desc: "Do not use google/uuid. Use github.com/clubpay/ronykit/x/rkit (RandomID/RandomIDs/SecureRandomUint64)."
            - pkg: io/ioutil
              desc: "io/ioutil is deprecated; use io / os."
            - pkg: github.com/jinzhu/copier
              desc: "Do not use jinzhu/copier. Use github.com/clubpay/ronykit/x/rkit (DynCast/DynCastOption/TypeConvert)."
            - pkg: github.com/samber/lo
              desc: "Do not use samber/lo. Use github.com/clubpay/ronykit/x/rkit (Map/Filter/Reduce/Contains/Coalesce/...) or slices/maps."
            - pkg: github.com/thoas/go-funk
              desc: "Do not use go-funk. Use github.com/clubpay/ronykit/x/rkit collection helpers or slices/maps."
            - pkg: github.com/iancoleman/strcase
              desc: "Do not use iancoleman/strcase. Use github.com/clubpay/ronykit/x/rkit (ToCamel/ToSnake/ToKebab/...)."
            - pkg: github.com/ettle/strcase
              desc: "Do not use ettle/strcase. Use github.com/clubpay/ronykit/x/rkit (ToCamel/ToSnake/ToKebab/...)."
            - pkg: github.com/gofrs/uuid
              desc: "Do not use gofrs/uuid. Use github.com/clubpay/ronykit/x/rkit (RandomID/SecureRandomUint64)."
            - pkg: github.com/rs/xid
              desc: "Do not use rs/xid. Use github.com/clubpay/ronykit/x/rkit (RandomID)."
            - pkg: github.com/oklog/ulid
              desc: "Do not use oklog/ulid. Use github.com/clubpay/ronykit/x/rkit (RandomID)."
            - pkg: github.com/segmentio/ksuid
              desc: "Do not use segmentio/ksuid. Use github.com/clubpay/ronykit/x/rkit (RandomID)."
            - pkg: github.com/matoous/go-nanoid
              desc: "Do not use go-nanoid. Use github.com/clubpay/ronykit/x/rkit (RandomID)."
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
