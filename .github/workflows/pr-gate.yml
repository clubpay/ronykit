name: PR Gate

on:
  # NO `branches:` filter -- every PR, whatever it targets. An allow-list fails
  # QUIETLY: the first PR onto a release or feature branch gets no gate at all,
  # which is indistinguishable from passing. Stacked PRs are scoped correctly
  # anyway, since every check measures the diff against ITS OWN merge base.
  pull_request:
    # `edited`: without it the size check never re-runs after the author adds a
    # `size-exception:` line to the description.
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # G1 gate: lint, unit tests, coverage, PR size, static analysis, security,
  # secrets, CODEOWNERS. Runs alongside go.yml, which keeps owning the codecov
  # upload.
  #
  # To make it blocking, set SOFT_FAIL to false AND add `g1 / <check>` as
  # required status checks in the repository ruleset.
  g1:
    uses: clubpay/reusable-workflows/.github/workflows/pr-gate.go.yml@main
    with:
      # No root go.mod: 46 modules under go.work, which setup-go also reads the
      # version from (1.25.8).
      GO_VERSION_FILE: 'go.work'
      SOFT_FAIL: true
      PR_SIZE_LIMIT: 400
      # testenv spins Docker containers through gnomock, so it cannot run on a
      # bare runner -- the repo's own go.yml leaves it out for the same reason.
      # Its module path is `ronykit/testenv`, not the full URL the others use.
      UNIT_TEST_EXCLUDE_PATTERN: '/integration_test(/|$)|/test/(e2e|integration)(/|$)|^ronykit/testenv'
    # No GLOBAL_REPO_TOKEN: every dependency here is public, which is also what
    # lets the gate work on fork PRs, where no secret is available.
